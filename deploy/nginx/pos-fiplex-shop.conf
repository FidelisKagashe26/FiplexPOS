# POS Fiplex on shop.linkamall.com.
# ADDITIVE: its own server_name only, so it cannot affect linkamall.com,
# pharmacy.linkamall.com, or any other vhost on this host.
#
# Reuses the existing Cloudflare origin cert, which is a wildcard for
# *.linkamall.com (valid to 2041) — no certbot involvement.
# Cloudflare proxied, SSL mode Full (strict).

server {
    listen 80;
    listen [::]:80;
    server_name shop.linkamall.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name shop.linkamall.com;

    ssl_certificate /etc/ssl/cloudflare/linkamall.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/linkamall.com.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Product image uploads travel through the API.
    client_max_body_size 20m;

    access_log /var/log/nginx/pos-fiplex.access.log;
    error_log  /var/log/nginx/pos-fiplex.error.log;

    # Uploaded objects, served straight from MinIO. R2_PUBLIC_DOMAIN points
    # here, and the trailing /pos-fiplex/ maps the public path onto the bucket.
    location /storage/ {
        proxy_pass http://127.0.0.1:9000/pos-fiplex/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Live order updates. Needs its own block so the upgrade headers are not
    # set on ordinary requests; $connection_upgrade is not defined on this
    # host, so "upgrade" is hardcoded here as the other vhosts do.
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # The Go binary serves both the API and the built SPA, so a single
    # upstream covers the whole app — no separate static root needed.
    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
