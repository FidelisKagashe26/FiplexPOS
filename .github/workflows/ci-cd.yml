name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # GHCR rejects uppercase, so this is spelled out rather than derived from
  # github.repository (FidelisKagashe26/FiplexPOS).
  IMAGE_NAME: fideliskagashe26/fiplexpos

jobs:
  test:
    name: Run Tests & Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Go Vet
        working-directory: ./backend
        run: go vet ./...

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build Frontend (SPA)
        working-directory: ./frontend
        run: bun run build

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: IMAGE_REF
          script: |
            set -e
            cd /opt/pos-fiplex

            # Pin the exact commit that was just built, so a rollback is only
            # ever an APP_IMAGE edit away.
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE_REF}|" .env

            docker compose pull
            docker compose up -d --remove-orphans

            # Fail the deploy loudly rather than leaving a broken container up.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8093/healthz > /dev/null; then
                echo "healthz OK after ${i}s"
                exit_ok=1
                break
              fi
              sleep 1
            done
            if [ -z "${exit_ok:-}" ]; then
              echo "Health check failed. Recent logs:"
              docker compose logs --tail 50 app
              exit 1
            fi

            docker image prune -f
        env:
          IMAGE_REF: ghcr.io/fideliskagashe26/fiplexpos:sha-${{ github.sha }}
